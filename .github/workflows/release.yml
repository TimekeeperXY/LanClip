name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.2.1
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run tauri build

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*setup.exe" | Select-Object -First 1
          $portable = "src-tauri/target/release/lanclip.exe"
          gh release create $env:RELEASE_TAG $installer.FullName $portable --generate-notes --title "LanClip $env:RELEASE_TAG"
