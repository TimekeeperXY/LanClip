name: Build desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.2.3
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.os }}

      - run: npm ci

      - name: Build Windows bundles
        if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles nsis

      - name: Prepare Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*setup.exe" | Select-Object -First 1
          $portable = "src-tauri/target/release/lanclip.exe"
          Copy-Item $installer.FullName "artifacts/$($installer.Name)"
          Copy-Item $portable "artifacts/lanclip-windows-x64.exe"

      - name: Build macOS bundles
        if: runner.os == 'macOS'
        run: npm run tauri build -- --bundles dmg

      - name: Prepare macOS artifacts
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          find src-tauri/target/release/bundle -maxdepth 3 -type f -print
          cp src-tauri/target/release/bundle/dmg/*.dmg artifacts/

      - uses: actions/upload-artifact@v5
        with:
          name: lanclip-${{ matrix.artifact }}
          path: artifacts/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mapfile -t files < <(find release-artifacts -type f | sort)
          gh release create "$RELEASE_TAG" "${files[@]}" --generate-notes --title "LanClip $RELEASE_TAG"
